<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#081426">
<title>إنشاء حساب موكل | المحامي ياسر العتيبي</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--gold:#d9b56a;--light:#f1d99c}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(ellipse at 15% 0%,rgba(217,181,106,.13),transparent 34%),linear-gradient(135deg,#050d19,#102743);font-family:"IBM Plex Sans Arabic",sans-serif;color:#fff}
.panel{width:min(100%,650px);border:1px solid rgba(255,255,255,.18);border-radius:27px;padding:clamp(23px,5vw,40px);background:linear-gradient(145deg,rgba(255,255,255,.12),rgba(255,255,255,.035));backdrop-filter:blur(27px);box-shadow:0 30px 90px rgba(0,0,0,.35)}
.heading{text-align:center;margin-bottom:24px}.mark{width:54px;height:54px;border:1px solid rgba(217,181,106,.5);background:rgba(217,181,106,.1);border-radius:17px;display:grid;place-items:center;color:var(--light);font-size:27px;margin:0 auto 14px}
h1{font:700 26px "Amiri",serif;margin:0 0 6px}.heading p{color:#a8b7c9;font-size:12px;line-height:1.8;margin:0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}.field{min-width:0}.full{grid-column:1/-1}
label{display:block;font-size:12px;color:#d4deea;margin:0 0 7px;font-weight:600}
input,select{width:100%;padding:12px 13px;margin-bottom:15px;border:1px solid rgba(255,255,255,.17);border-radius:11px;background:rgba(4,13,25,.38);color:#fff;font:14px "IBM Plex Sans Arabic",sans-serif;outline:none}
select option{color:#142338;background:#fff}input:focus,select:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(217,181,106,.12)}
.notice{display:flex;gap:9px;padding:12px 13px;margin:0 0 17px;border:1px solid rgba(217,181,106,.2);background:rgba(217,181,106,.06);border-radius:12px;color:#b7c3d1;font-size:11px;line-height:1.8}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:14px;background:linear-gradient(135deg,var(--light),#c99c4b);color:#142238;font:700 14px "IBM Plex Sans Arabic",sans-serif;cursor:pointer}
.btn:disabled{opacity:.6;cursor:wait}.message{display:none;margin-bottom:15px;padding:12px;border-radius:10px;font-size:12px;line-height:1.7}.message.show{display:block}.error{border:1px solid rgba(255,109,109,.28);background:rgba(180,32,45,.12);color:#ffb6b6}.success{border:1px solid rgba(99,220,155,.25);background:rgba(25,130,78,.12);color:#a8f0c8}
.back{display:block;text-align:center;margin-top:19px;color:var(--light);font-size:12px;text-decoration:none}
@media(max-width:520px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}

/* Transparent glass finish — client registration */
body{background:radial-gradient(ellipse at 12% 8%,rgba(48,104,158,.25),transparent 35%),radial-gradient(ellipse at 87% 86%,rgba(201,157,79,.12),transparent 28%),linear-gradient(145deg,#050e1d,#08182b 52%,#071426)!important}
.panel{background:linear-gradient(145deg,rgba(255,255,255,.075),rgba(255,255,255,.018))!important;border-color:rgba(255,255,255,.17)!important;box-shadow:0 30px 90px rgba(0,0,0,.32),inset 0 1px 0 rgba(255,255,255,.09)!important;backdrop-filter:blur(36px) saturate(150%)!important;-webkit-backdrop-filter:blur(36px) saturate(150%)!important}
input,select{background:rgba(1,9,20,.23)!important;border-color:rgba(255,255,255,.15)!important}input::placeholder{color:#71849b}
.notice{background:rgba(255,255,255,.025)!important;border-color:rgba(217,181,106,.17)!important}

</style>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>
<body>
<main class="panel">
<header class="heading"><div class="mark" aria-hidden="true">⚖</div><h1>إنشاء حساب موكل</h1><p>المحامي ياسر محسن عايض العتيبي<br>سجّل بياناتك لبدء بوابة متابعة الملف القانوني</p></header>
<div id="message" class="message" role="alert"></div>
<form id="registerForm">
<div class="grid">
<div class="field full"><label for="name">الاسم الكامل</label><input id="name" required maxlength="120" autocomplete="name" placeholder="الاسم كما في الهوية"></div>
<div class="field"><label for="email">البريد الإلكتروني</label><input id="email" type="email" required maxlength="254" autocomplete="email" placeholder="name@example.com"></div>
<div class="field"><label for="phone">رقم الهاتف</label><input id="phone" type="tel" required maxlength="20" autocomplete="tel" placeholder="رقم الهاتف"></div>
<div class="field"><label for="password">كلمة المرور</label><input id="password" type="password" required minlength="8" autocomplete="new-password" placeholder="٨ أحرف على الأقل"></div>
<div class="field"><label for="nationalId">رقم الهوية أو الإقامة</label><input id="nationalId" required inputmode="numeric" minlength="10" maxlength="10" placeholder="10 أرقام"></div>
<div class="field full"><label for="caseType">نوع القضية</label><select id="caseType" required><option value="">اختر نوع القضية</option><option>استرداد حقوق مالية</option><option>احتيال مالي</option><option>ميراث وتركات</option><option>تجارة إلكترونية</option><option>النزاعات المصرفية</option><option>القروض والتمويل</option><option>أخرى</option></select></div>
</div>
<div class="notice"><span aria-hidden="true">◇</span><span>تُستخدم هذه البيانات لإنشاء الحساب وربط ملفك. بعد التسجيل ستكون الحالة «قيد المراجعة» حتى تتحقق الإدارة وتضيف معلومات القضية. لا تُدخل بيانات دفع في هذا النموذج.</span></div>
<button id="registerButton" class="btn" type="submit">إنشاء الحساب بأمان</button>
</form>
<a class="back" href="client-login.html">لديك حساب؟ تسجيل الدخول</a>
</main>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { FIREBASE_CONFIG } from "./firebase-config.js";

const app = initializeApp(FIREBASE_CONFIG);
const auth = getAuth(app);
const db = getFirestore(app);
const form = document.getElementById("registerForm");
const btn = document.getElementById("registerButton");
const message = document.getElementById("message");

function show(kind, text) {
  message.className = "message show " + kind;
  message.textContent = text;
}

form.addEventListener("submit", async event => {
  event.preventDefault();
  message.className = "message";
  btn.disabled = true;
  btn.textContent = "جارٍ إنشاء الحساب...";

  const name = document.getElementById("name").value.trim();
  const email = document.getElementById("email").value.trim().toLowerCase();
  const phone = document.getElementById("phone").value.trim();
  const password = document.getElementById("password").value;
  const nationalId = document.getElementById("nationalId").value.trim();
  const caseType = document.getElementById("caseType").value;

  if (!/^\d{10}$/.test(nationalId)) {
    show("error", "يرجى إدخال رقم هوية أو إقامة مكوّن من 10 أرقام.");
    btn.disabled = false;
    btn.textContent = "إنشاء الحساب بأمان";
    return;
  }

  let profileCreated = false;
  try {
    let credential;
    try {
      credential = await createUserWithEmailAndPassword(auth, email, password);
    } catch (createError) {
      if (createError.code !== "auth/email-already-in-use") throw createError;
      credential = await signInWithEmailAndPassword(auth, email, password);
    }

    const user = credential.user;
    const profileRef = doc(db, "clients", user.uid);
    const existingProfile = await getDoc(profileRef);

    if (existingProfile.exists()) {
      const currentProfile = existingProfile.data();
      if (currentProfile.accountStatus === "suspended") {
        await signOut(auth);
        show("error", "تم إيقاف الوصول إلى هذا الحساب. يرجى التواصل مع الإدارة.");
        return;
      }
      window.location.replace("dashboard.html");
      return;
    }

    await setDoc(profileRef, {
      authUid: user.uid,
      name,
      email,
      phone,
      nationalId,
      caseType,
      caseNumber: "بانتظار التخصيص",
      status: "غير مسندة",
      accountStatus: "pending",
      court: "",
      circuit: "",
      filedDate: "",
      opponent: "",
      notes: "",
      createdAt: serverTimestamp()
    });
    profileCreated = true;

    // Do not send email-verification messages or sign the newly created client out.
    window.location.replace("dashboard.html?welcome=1");
  } catch (error) {
    if (auth.currentUser) {
      try { await signOut(auth); } catch (signOutError) { console.error("Sign-out failed", signOutError); }
    }

    const code = error && error.code;
    let text;
    if (code === "auth/unauthorized-domain") {
      text = "Firebase لا يسمح بالتسجيل من نطاق الموقع الحالي. تأكد من إضافة ksaryad.github.io إلى Authorized domains في مشروع yasserlwo.";
    } else if (code === "auth/operation-not-allowed") {
      text = "التسجيل بالبريد الإلكتروني وكلمة المرور غير مفعّل في Firebase Authentication.";
    } else if (code === "permission-denied" || code === "firestore/permission-denied") {
      text = "تم إنشاء حساب الدخول، لكن Firestore رفض حفظ ملف الموكل. يلزم مراجعة قواعد Firestore المنشورة.";
    } else if (code === "auth/email-already-in-use" || code === "auth/invalid-credential" || code === "auth/wrong-password") {
      text = "هذا البريد مستخدم من قبل أو كلمة المرور غير صحيحة. سجّل الدخول أو استخدم استعادة كلمة المرور.";
    } else if (code === "auth/invalid-email") {
      text = "صيغة البريد الإلكتروني غير صحيحة. راجع البريد ثم أعد المحاولة.";
    } else if (code === "auth/weak-password") {
      text = "كلمة المرور ضعيفة. استخدم 8 أحرف على الأقل.";
    } else if (code === "auth/network-request-failed") {
      text = "تعذر الاتصال بخدمة التسجيل. تحقق من الاتصال بالإنترنت ثم أعد المحاولة.";
    } else if (code === "auth/too-many-requests") {
      text = "تمت محاولات كثيرة خلال وقت قصير. انتظر قليلًا ثم أعد المحاولة.";
    } else if (code === "auth/configuration-not-found" || code === "auth/api-key-not-valid") {
      text = "إعداد Firebase المرتبط بالموقع غير مكتمل أو غير صحيح.";
    } else if (profileCreated) {
      text = "تم إنشاء الحساب، لكن تعذر فتح البوابة تلقائيًا. سجّل الدخول من صفحة بوابة العميل.";
    } else {
      text = "لم يكتمل التسجيل. رمز التشخيص: " + (code || "غير معروف") + ".";
    }
    console.error("Client registration failed", { code, message: error && error.message });
    show("error", text);
  } finally {
    btn.disabled = false;
    btn.textContent = "إنشاء الحساب بأمان";
  }
});
</script>
</body>
</html>
