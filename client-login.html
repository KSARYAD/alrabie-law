<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#081426">
  <title>دخول الموكل | المحامي ياسر العتيبي</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root{color-scheme:dark;--gold:#d9b56a;--gold-light:#f1d99c;--navy:#081426}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(ellipse at 20% 10%,rgba(217,181,106,.12),transparent 35%),radial-gradient(ellipse at 90% 90%,rgba(43,101,151,.25),transparent 40%),linear-gradient(135deg,#050d19,#102743);font-family:"IBM Plex Sans Arabic",sans-serif;color:#fff}
    .panel{width:min(100%,460px);border:1px solid rgba(255,255,255,.18);border-radius:27px;padding:clamp(24px,6vw,42px);background:linear-gradient(145deg,rgba(255,255,255,.12),rgba(255,255,255,.035));backdrop-filter:blur(27px);box-shadow:0 30px 90px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.15)}
    .mark{width:62px;height:62px;border:1px solid rgba(217,181,106,.5);background:rgba(217,181,106,.1);border-radius:19px;display:grid;place-items:center;color:var(--gold-light);font-size:30px;margin:0 auto 18px}
    h1{font:700 27px "Amiri",serif;text-align:center;margin:0 0 5px}
    .sub{text-align:center;color:#a8b7c9;font-size:13px;margin:0 0 28px;line-height:1.8}
    label{display:block;font-size:12px;color:#d4deea;margin:0 0 8px;font-weight:600}
    input{width:100%;padding:13px 14px;margin-bottom:17px;border:1px solid rgba(255,255,255,.17);border-radius:11px;background:rgba(4,13,25,.38);color:#fff;font:14px inherit;font-family:inherit;outline:none}
    input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(217,181,106,.12)}
    .btn{display:block;width:100%;border:0;border-radius:12px;padding:14px;background:linear-gradient(135deg,var(--gold-light),#c99c4b);color:#142238;font:700 14px inherit;font-family:inherit;cursor:pointer}
    .btn:disabled{opacity:.6;cursor:wait}
    .message{display:none;border:1px solid rgba(255,109,109,.28);background:rgba(180,32,45,.12);color:#ffb6b6;padding:12px;border-radius:10px;font-size:12px;line-height:1.7;margin-bottom:15px}
    .message.show{display:block}
    .register{display:block;text-align:center;margin-top:18px;color:var(--gold-light);font-size:13px;text-decoration:none}
    .forgot{display:block;width:100%;margin:12px 0 0;border:0;background:transparent;color:#b8c8da;font:12px "IBM Plex Sans Arabic",sans-serif;text-decoration:underline;cursor:pointer}
    .back{display:block;text-align:center;margin-top:23px;color:#91a1b6;font-size:12px;text-decoration:none}
    .notice{margin-top:22px;padding-top:15px;border-top:1px solid rgba(255,255,255,.1);color:#8293aa;font-size:11px;line-height:1.8;text-align:center}
  
/* Transparent glass finish — client login */
body{background:radial-gradient(ellipse at 12% 8%,rgba(48,104,158,.25),transparent 35%),radial-gradient(ellipse at 86% 85%,rgba(201,157,79,.12),transparent 28%),linear-gradient(145deg,#050e1d,#08182b 52%,#071426)!important}
.panel{background:linear-gradient(145deg,rgba(255,255,255,.075),rgba(255,255,255,.018))!important;border-color:rgba(255,255,255,.17)!important;box-shadow:0 30px 90px rgba(0,0,0,.32),inset 0 1px 0 rgba(255,255,255,.09)!important;backdrop-filter:blur(36px) saturate(150%)!important;-webkit-backdrop-filter:blur(36px) saturate(150%)!important}
input{background:rgba(1,9,20,.23)!important;border-color:rgba(255,255,255,.15)!important}input::placeholder{color:#71849b}
.notice{border-top-color:rgba(255,255,255,.12)!important;color:#9aacc1!important}
.message{backdrop-filter:blur(20px)!important}

</style>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>
<body>
  <main class="panel">
    <div class="mark" aria-hidden="true">⚖</div>
    <h1>بوابة الموكل</h1>
    <p class="sub">المحامي ياسر محسن عايض العتيبي<br>سجّل الدخول لمتابعة ملفك القانوني</p>
    <div class="message" id="message" role="alert"></div>
    <form id="loginForm">
      <label for="email">البريد الإلكتروني</label>
      <input id="email" type="email" autocomplete="username" required placeholder="name@example.com">
      <label for="password">كلمة المرور</label>
      <input id="password" type="password" autocomplete="current-password" required placeholder="أدخل كلمة المرور">
      <button class="btn" id="loginButton" type="submit">تسجيل الدخول</button>
      <button class="forgot" id="forgotButton" type="button">نسيت كلمة المرور؟ إرسال رابط استعادة</button>
    </form>
    <a class="register" href="client-register.html">إنشاء حساب موكل جديد</a>
    <a class="back" href="index.html">العودة إلى الموقع الرئيسي</a>
    <p class="notice">يمكنك الدخول مباشرة دون تأكيد البريد الإلكتروني. تُعرض تفاصيل القضية بعد اعتماد الإدارة لحسابك. إذا كان لديك ملف قديم، تواصل مع الإدارة لربط الحساب بالملف الصحيح.</p>
  </main>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, sendPasswordResetEmail, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
    import { FIREBASE_CONFIG } from "./firebase-config.js";

    const app = initializeApp(FIREBASE_CONFIG);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const form = document.getElementById("loginForm");
    const button = document.getElementById("loginButton");
    const message = document.getElementById("message");

    function showError(text) {
      message.textContent = text;
      message.classList.add("show");
    }
    const queryParams = new URLSearchParams(location.search);
    if (queryParams.get("account") === "pending") {
      showError("هذا الحساب غير مرتبط بملف موكل. إذا أكملت التسجيل ولم تُحفظ بياناتك، ارجع إلى صفحة التسجيل وأعد المحاولة بنفس البريد وكلمة المرور.");
    } else if (queryParams.get("account") === "review") {
      showError("حسابك قيد مراجعة الإدارة. يمكنك دخول البوابة الآن، وستظهر تفاصيل الملف بعد تفعيل الحساب.");
    } else if (queryParams.get("account") === "suspended") {
      showError("تم إيقاف الوصول إلى هذا الحساب. يرجى التواصل مع الإدارة.");
    }

    form.addEventListener("submit", async event => {
      event.preventDefault();
      message.classList.remove("show");
      button.disabled = true;
      button.textContent = "جارٍ التحقق...";
      const email = document.getElementById("email").value.trim().toLowerCase();
      const password = document.getElementById("password").value;
      try {
        const credential = await signInWithEmailAndPassword(auth, email, password);
        const profile = await getDoc(doc(db, "clients", credential.user.uid));
        if (!profile.exists()) {
          await signOut(auth);
          showError("هذا الحساب غير مرتبط بملف موكل. إذا أكملت التسجيل، ارجع إلى صفحة التسجيل وأعد المحاولة بنفس البريد وكلمة المرور.");
          return;
        }
        const profileData = profile.data();
        if (profileData.accountStatus === "suspended") {
          await signOut(auth);
          showError("تم إيقاف الوصول إلى هذا الحساب. يرجى التواصل مع الإدارة.");
          return;
        }
        location.href = "dashboard.html";
      } catch (error) {
        console.error("Client login failed", { code: error && error.code, message: error && error.message });
        const code = error && error.code;
        const text = code === "auth/unauthorized-domain" ? "نطاق الموقع غير مسموح في إعدادات Firebase Authentication." : code === "auth/operation-not-allowed" ? "تسجيل البريد وكلمة المرور غير مفعّل في Firebase Authentication." : code === "auth/network-request-failed" ? "تعذر الاتصال بخدمة الدخول. تحقق من الإنترنت ثم أعد المحاولة." : code === "permission-denied" || code === "firestore/permission-denied" ? "تعذر قراءة ملفك من قاعدة البيانات. يلزم مراجعة قواعد Firestore." : code === "auth/invalid-credential" || code === "auth/wrong-password" || code === "auth/user-not-found" ? "البريد أو كلمة المرور غير صحيحة. يمكنك استخدام استعادة كلمة المرور." : "تعذر تسجيل الدخول. رمز التشخيص: " + (code || "غير معروف") + ".";
        showError(text);
      } finally {
        button.disabled = false;
        button.textContent = "تسجيل الدخول";
      }
    });

    document.getElementById("forgotButton").addEventListener("click", async () => {
      message.classList.remove("show");
      const email = document.getElementById("email").value.trim().toLowerCase();
      if (!email) { showError("أدخل بريدك الإلكتروني أولًا ثم اضغط استعادة كلمة المرور."); return; }
      try {
        await sendPasswordResetEmail(auth, email);
        showError("إذا كان البريد مسجلًا، فستصلك رسالة تتضمن رابط تغيير كلمة المرور.");
      } catch (error) {
        showError("تعذر إرسال رابط الاستعادة الآن. تحقق من البريد وحاول لاحقًا.");
      }
    });
  </script>
</body>
</html>
